name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test

  paquete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: El paquete solo publica src/, README.md, LICENSE y package.json
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const [p] = require("./pack.json");
            const permitidos = /^(src\/.+|README\.md|LICENSE|package\.json)$/;
            const fuera = p.files.map(f => f.path).filter(f => !permitidos.test(f));
            console.log(p.files.map(f => f.path).join("\n"));
            if (fuera.length) { console.error("Ficheros no previstos en el paquete:", fuera); process.exit(1); }
          '
